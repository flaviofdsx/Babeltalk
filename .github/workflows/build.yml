name: Build e release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Validar e compilar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar aplicação
        run: npm run build

      - name: Gerar instalador
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist

      - name: Armazenar instalador
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: babeltalk-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: babeltalk-*
          path: release-artifacts
          merge-multiple: true

      - name: Anexar instaladores à release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
          fail_on_unmatched_files: true
